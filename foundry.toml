[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.35"
optimizer = true
optimizer_runs = 4294967295
via_ir = true
isolate = true
fs_permissions = [{ access = "read", path = "out" }, { access = "read", path = "test/fixtures/safe" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
